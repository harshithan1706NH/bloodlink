spring.application.name=BloodLink
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bloodlink}
spring.datasource.username=${DB_USER:bloodlink}
spring.datasource.password=${DB_PASSWORD:bloodlink}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
server.port=8080
notification.service.url=${NOTIFICATION_SERVICE_URL:http://localhost:8081/api}
